<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصمم الوصفة والفاتورة — نسخة تجريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a33;--muted:#6b7782;--line:#d9e0e6;--brand:#1f6f8b;--brand2:#e8f3f7;--danger:#c0392b;--bg:#e9edf1}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;min-height:32px;white-space:nowrap}
button:hover{background:#f2f5f7}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:#185a71}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--brand2);border-color:var(--brand);color:var(--brand);font-weight:600}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted);font-size:12px}

header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
header.top h1{font-size:15px;margin:0 0 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:30px}
.seg button+button{border-inline-start:1px solid var(--line)}
.sep{width:1px;height:26px;background:var(--line)}
.grow{flex:1}

main{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 290px;min-height:0}
aside{background:#fff;overflow:auto;min-height:0}
#palette{border-inline-end:1px solid var(--line);padding:8px 10px 20px}
#props{border-inline-start:1px solid var(--line);padding:12px 14px 30px}
.group h3{font-size:12px;color:var(--muted);margin:14px 2px 6px;font-weight:700}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:start;margin-bottom:4px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:grab;user-select:none;min-height:30px}
.pal-item:hover{border-color:var(--brand);background:var(--brand2)}
.pal-item .ic{width:20px;text-align:center;color:var(--brand);font-weight:700}
.pal-item .used{margin-inline-start:auto;color:#2e8b57;font-size:12px}
#palette.disabled{opacity:.45;pointer-events:none}

#stage{position:relative;overflow:auto;min-height:0;display:flex;padding:30px;direction:ltr}
#sizer{margin:auto;position:relative;flex:none}
#paper{position:absolute;top:0;left:0;background:#fff;box-shadow:0 4px 20px rgba(20,40,60,.18);transform-origin:0 0;overflow:hidden;color:#1f2a33;direction:rtl}
html[lang="fr"] #paper{direction:ltr}
.design .el{outline:1px dashed rgba(31,111,139,.35);cursor:move}
.design .el:hover{outline-color:var(--brand)}
.design .el.sel{outline:1.5px solid var(--brand)}
.design .el.locked{cursor:not-allowed}
.grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.045) 1px,transparent 1px);background-size:5mm 5mm}
.margin-guide{position:absolute;border:1px dashed rgba(192,57,43,.35);pointer-events:none}
.el{position:absolute;overflow:hidden}
.el .content{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow-wrap:anywhere}
.el.overflow{outline:1.5px dashed var(--danger)!important}
.el.overflow::after{content:"⚠";position:absolute;top:0;left:0;background:var(--danger);color:#fff;font:700 8pt Tahoma,sans-serif;padding:.3mm 1mm;border-radius:0 0 1mm 0;z-index:5}
html[lang="fr"] .el.overflow::after{left:auto;right:0;border-radius:0 0 0 1mm}
.ph{background:rgba(31,111,139,.1);color:#1f6f8b;border-radius:2px;padding:0 1mm}
.img-ph{width:100%;height:100%;border:1px dashed #9fb3c0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a8a96;font-size:8pt;text-align:center;background:#f7fafb}
.img-ph small{font-size:6pt}
.preview .img-ph{visibility:hidden}
.preview .stamp{visibility:hidden}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th,.tbl td{border:1px solid var(--tb);padding:1.1mm 1.4mm;text-align:start;vertical-align:top}
.tbl th{font-weight:700}
.tot{width:100%;border-collapse:collapse}
.tot td{padding:.9mm 1.5mm;border-bottom:1px solid var(--tb)}
.tot .num{text-align:left;direction:ltr}
html[lang="fr"] .tot .num{text-align:right}
.tot tr.b td{font-weight:700;background:rgba(31,111,139,.07)}
.txt[contenteditable=true]{outline:1px solid #f0a500;background:#fffbe8;cursor:text;user-select:text}
.selbox{position:absolute;pointer-events:none;z-index:100000}
.hdl{position:absolute;width:var(--hs);height:var(--hs);background:#fff;border:calc(var(--hs)/5) solid var(--brand);transform:translate(-50%,-50%);pointer-events:auto;border-radius:1px}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-n{left:50%;top:0;cursor:ns-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-e{left:100%;top:50%;cursor:ew-resize}
.h-se{left:100%;top:100%;cursor:nwse-resize}.h-s{left:50%;top:100%;cursor:ns-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}.h-w{left:0;top:50%;cursor:ew-resize}
.selinfo{position:absolute;top:100%;left:0;margin-top:calc(var(--hs) * .8);background:var(--brand);color:#fff;font:calc(11px / var(--z)) Tahoma,sans-serif;padding:0 calc(4px / var(--z));border-radius:calc(3px / var(--z));white-space:nowrap;direction:ltr}
.guide{position:absolute;background:#e5367a;pointer-events:none;z-index:100001}
.guide.v{top:0;bottom:0;width:calc(1px / var(--z))}
.guide.h{left:0;right:0;height:calc(1px / var(--z))}

.ps{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.ps h4{margin:0 0 8px;font-size:13px}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-size:13px}
label.f input[type=color]{padding:1px;height:30px;width:100%}
label.c{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btns button{font-size:12px;min-height:28px;padding:2px 8px}
.tips{padding-inline-start:18px;margin:6px 0;font-size:12.5px;color:#3d4a55}
.tips li{margin-bottom:4px}
kbd{background:#f1f3f5;border:1px solid #cfd6dc;border-radius:3px;padding:0 4px;font-size:11px}

footer{display:flex;gap:16px;align-items:center;padding:5px 12px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
#st-warn{color:var(--danger);font-weight:600}
#st-msg{color:var(--brand);font-weight:600}

@media(max-width:1000px){main{grid-template-columns:180px minmax(0,1fr) 240px}}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  header.top,#palette,#props,footer{display:none!important}
  main{display:block}
  #stage{padding:0;overflow:visible;display:block}
  #sizer{width:auto!important;height:auto!important;margin:0}
  #paper{position:relative;transform:none!important;box-shadow:none}
  .el.overflow{outline:none!important}.el.overflow::after{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageSize">@page{size:A5 portrait;margin:0}</style>
</head>

  <h1 id="ui-title">🦷 مصمم المستندات</h1>
  <div class="seg" id="langSeg">

    <button data-lang="fr">Français</button>
  </div>
  <div class="sep"></div>
  <div class="seg" id="docSeg">
    <button data-doc="rx" id="ui-docRx">الوصفة الطبية</button>
    <button data-doc="invoice" id="ui-docInv">الفاتورة</button>
  </div>
  <div class="seg" id="paperSeg">
    <button data-paper="A5">A5</button>
    <button data-paper="A4">A4</button>
  </div>
  <div class="sep"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="design" id="ui-modeDes">✎ تصميم</button>
    <button data-mode="preview" id="ui-modePre">👁 معاينة</button>
  </div>
  <select id="sample">
    <option value="short" id="ui-sShort">بيانات قصيرة</option>
    <option value="long" id="ui-sLong">بيانات طويلة (اختبار)</option>

  <div class="sep"></div>
  <button id="undo" title="تراجع">↶</button>
  <button id="redo" title="إعادة">↷</button>
  <button id="gridBtn">▦ شبكة</button>
  <button id="snapBtn">🧲 محاذاة</button>
  <div class="sep"></div>
  <button id="zoomOut">−</button>
  <span id="zoomVal" style="min-width:44px;text-align:center">100%</span>
  <button id="zoomIn">+</button>
  <button id="zoomFit">ملاءمة</button>
  <div class="grow"></div>
  <button id="exportBtn">⤓ تصدير</button>
  <button id="importBtn">⤒ استيراد</button>
  <button id="printBtn" class="primary">🖨 طباعة تجريبية</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</header>

<main>
  <aside id="palette" aria-label="العناصر"></aside>
  <section id="stage" aria-label="مساحة التصميم">
    <div id="sizer"><div id="paper"></div></div>
  </section>
  <aside id="props" aria-label="الخصائص"></aside>
</main>

<footer>
  <span id="st-info"></span>
  <span id="st-pos"></span>
  <span id="st-warn"></span>
  <span id="st-msg"></span>
  <span class="grow"></span>
  <span id="ui-auto">يُحفظ تلقائياً في هذا المتصفح</span>
</footer>

function pushUndo(snap) { undoS.push(snap); if (undoS.length > 150) undoS.shift(); redoS.length = 0; }
function mutate(fn, o = {}) {
  const now = Date.now();
  if (!(o.key && o.key === lastKey && now - lastT < 1000)) pushUndo(JSON.stringify(S));

function elHTML(e, i) {
  const s = e.style;
  const line = e.type === 'hline' || e.type === 'vline';
  const box = `left:${e.x}mm;top:${e.y}mm;width:${e.w}mm;height:${e.h}mm;z-index:${i + 1};`;
  const deco = line ? '' : `background:${s.bg};border:${s.bw ? s.bw + 'px solid ' + s.bc : '0'};border-radius:${s.radius}mm;padding:${s.pad}mm;`;
  const font = `font-size:${s.fs}pt;font-weight:${s.bold ? 700 : 400};font-style:${s.italic ? 'italic' : 'normal'};color:${s.color};text-align:${s.align};line-height:${s.lh};`;
  const jc = { start: 'flex-start', center: 'safe center', end: 'flex-end' }[s.valign || 'center'];
  const cls = ['el', e.id === ui.sel ? 'sel' : '', e.locked ? 'locked' : ''].join(' ');
  return `<div class="${cls}" data-id="${e.id}" style="${box}${deco}${font}"><div class="content" style="justify-content:${jc}">${inner(e)}</div></div>`;
}

function inner(e) {
  const s = e.style, d = getCAT()[e.key];
  switch (e.type) {
    case 'field': {
      const lbl = e.label ?? d.label;
      const v = ui.preview ? esc(D()[e.key] ?? '') : `<span class="ph">${esc(d.label)}</span>`;
      return `<div>${e.showLabel ? `<span style="font-weight:700;color:${s.lblColor}">${esc(lbl)}:</span> ` : ''}${v}</div>`;
    }
    case 'text': return `<div class="txt">${esc(e.text).replace(/\n/g, '<br>')}</div>`;
    case 'logo':
    case 'image':
      return e.src ? `<img src="${e.src}" alt="" style="width:100%;height:100%;object-fit:${s.fit};display:block">`
        : `<div class="img-ph">${esc(d.label)}<small>${L('imgDbl')}</small></div>`;
    case 'hline': return `<div style="width:100%;border-top:${s.bw}px ${s.dash ? 'dashed' : 'solid'} ${s.bc}"></div>`;
    case 'vline': return `<div style="position:absolute;left:50%;top:0;bottom:0;border-left:${s.bw}px ${s.dash ? 'dashed' : 'solid'} ${s.bc}"></div>`;
    case 'rect': return '';
    case 'rxSymbol': return '<div>℞</div>';
    case 'rxTable':
    case 'invTable': return tableInner(e);
    case 'totals': return totalsInner(e);
    case 'signature': return `<div style="border-top:1px solid ${s.color};padding-top:1mm">${esc(e.text)}</div>`;
    case 'stamp': return `<div class="stamp" style="width:100%;height:100%;border:1.2px dashed currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center">${esc(e.text)}</div>`;
    case 'qr': return qrSVG();
  }
  return '';
}

function tableInner(e) {
  const isRx = e.type === 'rxTable';
  const rxCols = L('rxCols');
  const invCols = L('invCols');
  const RX_COLS = [
    { k: 'i', t: rxCols.i, w: 7 }, { k: 'name', t: rxCols.name, w: 30 }, { k: 'dose', t: rxCols.dose },
    { k: 'freq', t: rxCols.freq }, { k: 'dur', t: rxCols.dur }, { k: 'note', t: rxCols.note }
  ];
  const INV_COLS = [
    { k: 'i', t: invCols.i, w: 6 }, { k: 'name', t: invCols.name, w: 38 }, { k: 'tooth', t: invCols.tooth, w: 9 },
    { k: 'qty', t: invCols.qty, w: 9 }, { k: 'price', t: invCols.price }, { k: 'total', t: invCols.total }
  ];
  
  const colsList = (isRx ? RX_COLS : INV_COLS).filter(c => e.cols.includes(c.k));
  const rows = isRx ? D().meds : D().items;
  const th = colsList.map(c => `<th style="width:${c.w ? c.w + '%' : 'auto'}">${esc(c.t)}</th>`).join('');
  const tr = rows.map((r, i) => '<tr>' + colsList.map(c => {
    let v;
    if (c.k === 'i') v = i + 1;
    else if (c.k === 'price') v = money(r.price);
    else if (c.k === 'total') v = money(r.qty * r.price);
    else v = r[c.k];
    return `<td>${esc(v)}</td>`;
  }).join('') + '</tr>').join('');
  return `<table class="tbl" style="--tb:${e.style.tbc}"><thead><tr style="background:${e.style.headBg}">${th}</tr></thead><tbody>${tr}</tbody></table>`;
}
function totalsInner(e) {
  const d = D();
  const sub = d.items.reduce((a, r) => a + r.qty * r.price, 0), tot = sub - d.discount;
  const tl = L('totLbls');
  const rows = [[tl[0], sub], [tl[1], d.discount], [tl[2], tot, 1], [tl[3], d.paid], [tl[4], tot - d.paid, 1]];
  return `<table class="tot" style="--tb:${e.style.tbc}">${rows.map(([l, v, b]) => `<tr class="${b ? 'b' : ''}"><td>${l}</td><td class="num">${money(v)}</td></tr>`).join('')}</table>`;
}
let qrCache = null;
function qrSVG() {
  if (qrCache) return qrCache;
  let seed = 11, r = '';
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const inF = (x, y) => (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) if (!inF(x, y) && rnd() > .5) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return (qrCache = `<svg viewBox="0 0 21 21" width="100%" height="100%" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">${r}${f(0, 0)}${f(14, 0)}${f(0, 14)}</svg>`);

function snapTargets(self) {
  const p = P();
  const tx = [0, p.w / 2, p.w, SAFE, p.w - SAFE], ty = [0, p.h / 2, p.h, SAFE, p.h - SAFE];
  els().forEach(o => { if (o.id === self.id) return; tx.push(o.x, o.x + o.w / 2, o.x + o.w); ty.push(o.y, o.y + o.h / 2, o.y + o.h); });
  return { tx, ty };
}
function best(cands, targets, th) {
  let r = null;
  for (const c of cands) for (const t of targets) {
    const d = t - c;
    if (Math.abs(d) <= th && (!r || Math.abs(d) < Math.abs(r.d))) r = { d, t };
  }
  return r;
}

function startMove(ev, el) {
  const snap0 = JSON.stringify(S), sx = ev.clientX, sy = ev.clientY, ox = el.x, oy = el.y, k = 1 / (PX * ui.zoom);
  const node = paperEl.querySelector(`.el[data-id="${el.id}"]`), sb = paperEl.querySelector('.selbox');
  const { tx, ty } = snapTargets(el), th = 5 * k, p = P();
  let moved = false;
  paperEl.setPointerCapture(ev.pointerId);
  const onMove = m => {
    if (!moved && Math.hypot(m.clientX - sx, m.clientY - sy) < 3) return;
    moved = true;
    let x = ox + (m.clientX - sx) * k, y = oy + (m.clientY - sy) * k;
    const gs = [];
    if (ui.snap && !m.altKey) {
      const bx = best([x, x + el.w / 2, x + el.w], tx, th), by = best([y, y + el.h / 2, y + el.h], ty, th);
      if (bx) { x += bx.d; gs.push({ v: 1, at: bx.t }); } else x = Math.round(x);
      if (by) { y += by.d; gs.push({ v: 0, at: by.t }); } else y = Math.round(y);
    }
    el.x = r1(clamp(x, 0, p.w - el.w)); el.y = r1(clamp(y, 0, p.h - el.h));
    place(node, el); place(sb, el); showGuides(gs);
  };
  const onUp = () => {
    paperEl.removeEventListener('pointermove', onMove);
    paperEl.removeEventListener('pointerup', onUp);
    paperEl.removeEventListener('pointercancel', onUp);
    showGuides([]);
    if (moved) { pushUndo(snap0); lastKey = null; save(); render(); renderProps(); }
  };
  paperEl.addEventListener('pointermove', onMove);
  paperEl.addEventListener('pointerup', onUp);
  paperEl.addEventListener('pointercancel', onUp);
}

function startResize(ev, dir) {
  const el = selEl(); if (!el || el.locked) return;
  const snap0 = JSON.stringify(S), sx = ev.clientX, sy = ev.clientY, k = 1 / (PX * ui.zoom);
  const s0 = { L: el.x, T: el.y, R: el.x + el.w, B: el.y + el.h };
  const node = paperEl.querySelector(`.el[data-id="${el.id}"]`), sb = paperEl.querySelector('.selbox');
  const { tx, ty } = snapTargets(el), th = 5 * k, p = P(), MIN = 2;
  let moved = false;
  paperEl.setPointerCapture(ev.pointerId);
  const onMove = m => {
    moved = true;
    const dx = (m.clientX - sx) * k, dy = (m.clientY - sy) * k, gs = [];
    const sn = (v, targets, v1) => {
      if (!ui.snap || m.altKey) return v;
      const b = best([v], targets, th);
      if (b) { gs.push({ v: v1, at: b.t }); return b.t; }
      return Math.round(v);
    };
    let { L, T, R, B } = s0;
    if (dir.includes('w')) L = clamp(sn(L + dx, tx, 1), 0, R - MIN);
    if (dir.includes('e')) R = clamp(sn(R + dx, tx, 1), L + MIN, p.w);
    if (dir.includes('n')) T = clamp(sn(T + dy, ty, 0), 0, B - MIN);
    if (dir.includes('s')) B = clamp(sn(B + dy, ty, 0), T + MIN, p.h);
    el.x = r1(L); el.y = r1(T); el.w = r1(R - L); el.h = r1(B - T);
    place(node, el); place(sb, el); showGuides(gs);
    const info = sb && sb.querySelector('.selinfo'); if (info) info.textContent = `${r1(el.w)} × ${r1(el.h)} ${L('mm')}`;
  };
  const onUp = () => {
    paperEl.removeEventListener('pointermove', onMove);
    paperEl.removeEventListener('pointerup', onUp);
    paperEl.removeEventListener('pointercancel', onUp);
    showGuides([]);
    if (moved) { pushUndo(snap0); lastKey = null; save(); render(); renderProps(); }
  };
  paperEl.addEventListener('pointermove', onMove);
  paperEl.addEventListener('pointerup', onUp);
  paperEl.addEventListener('pointercancel', onUp);
}

function dblAction(el) {
  if (!el) return;
  if (el.type === 'text') return editText(el);
  if (el.type === 'logo' || el.type === 'image') { ui.sel = el.id; return $('#imgFile').click(); }
  if (el.type === 'field') { const i = $('#props [data-p="label"]'); if (i) { i.focus(); i.select(); } }
  if (el.type === 'signature' || el.type === 'stamp') { const t = $('#props textarea'); if (t) t.focus(); }
}
function editText(el) {
  const node = paperEl.querySelector(`.el[data-id="${el.id}"] .txt`); if (!node) return;
  node.contentEditable = 'true'; node.focus();
  const range = document.createRange(); range.selectNodeContents(node);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  node.addEventListener('keydown', k => { if (k.key === 'Escape') node.blur(); k.stopPropagation(); });
  node.addEventListener('blur', () => {
    const v = node.innerText.replace(/\n+$/, '');
    if (v !== el.text) mutate(() => { el.text = v; }); else render();
  }, { once: true });
}

$('#imgFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';

      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);

    if (confirm('سيتم حذف كل التعديلات والعودة للقالب الأصلي. متأكد؟')) mutate(() => { S.docs[S.docType].els = S.docType === 'rx' ? tplRx() : tplInv(); ui.sel = null; });
  } else if (act === 'clearAll') {
    if (confirm('سيتم مسح الورقة بالكامل. متأكد؟')) mutate(() => { els().length = 0; ui.sel = null; });
  } else if (act.startsWith('paper:')) {
    const p = act.split(':')[1];
    if (doc().paper !== p) mutate(() => {
      const o = doc().paper, n = p; doc().paper = p;
      const kx = PAPERS[n].w / PAPERS[o].w, ky = PAPERS[n].h / PAPERS[o].h;
      els().forEach(e => { e.x = r1(e.x * kx); e.y = r1(e.y * ky); e.w = r1(e.w * kx); e.h = r1(e.h * ky); });
    });
  }
  if (!el) return;
  if (act === 'deselect') select(null);
  else if (act === 'del') mutate(() => { els().splice(els().indexOf(el), 1); ui.sel = null; });
  else if (act === 'dup') mutate(() => { const n = JSON.parse(JSON.stringify(el)); n.id = uid(); n.x += 5; n.y += 5; els().push(n); ui.sel = n.id; });
  else if (act === 'lock') mutate(() => { el.locked = !el.locked; });
  else if (act === 'front') mutate(() => { const arr = els(), i = arr.indexOf(el); if (i < arr.length - 1) { arr.splice(i, 1); arr.push(el); } });
  else if (act === 'back') mutate(() => { const arr = els(), i = arr.indexOf(el); if (i > 0) { arr.splice(i, 1); arr.unshift(el); } });
  else if (act === 'alignRight') mutate(() => { el.x = r1(P().w - el.w - SAFE); });
  else if (act === 'alignLeft') mutate(() => { el.x = SAFE; });
  else if (act === 'centerH') mutate(() => { el.x = r1((P().w - el.w) / 2); });
  else if (act === 'centerV') mutate(() => { el.y = r1((P().h - el.h) / 2); });
  else if (act === 'fullW') mutate(() => { el.w = P().w - 2 * SAFE; el.x = SAFE; });
  else if (act === 'upload') $('#imgFile').click();
  else if (act === 'clearImg') mutate(() => { el.src = null; });
  else if (act.startsWith('textAlign:')) mutate(() => { el.style.align = act.split(':')[1]; });
  else if (act.startsWith('valign:')) mutate(() => { el.style.valign = act.split(':')[1]; });
});

/* ===================== Toolbar & Shortcuts ===================== */
$('#docSeg').addEventListener('click', e => { if (e.target.dataset.doc) { S.docType = e.target.dataset.doc; ui.sel = null; save(); render(); renderProps(); } });
$('#paperSeg').addEventListener('click', e => {
  const p = e.target.dataset.paper; if (p && p !== doc().paper) mutate(() => {
    const o = doc().paper; doc().paper = p;
    const kx = PAPERS[p].w / PAPERS[o].w, ky = PAPERS[p].h / PAPERS[o].h;
    els().forEach(x => { x.x = r1(x.x * kx); x.y = r1(x.y * ky); x.w = r1(x.w * kx); x.h = r1(x.h * ky); });
  });
});
$('#modeSeg').addEventListener('click', e => { if (e.target.dataset.mode) { ui.preview = e.target.dataset.mode === 'preview'; select(null); } });
$('#sample').addEventListener('change', e => { S.sample = e.target.value; save(); render(); });
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#gridBtn').onclick = () => { ui.grid = !ui.grid; render(); };
$('#snapBtn').onclick = () => { ui.snap = !ui.snap; render(); };

const setZ = z => { ui.zoom = clamp(z, .4, 3); render(); };
$('#zoomOut').onclick = () => setZ(ui.zoom - .1);
$('#zoomIn').onclick = () => setZ(ui.zoom + .1);
$('#zoomFit').onclick = () => {
  const r = stage.getBoundingClientRect(), p = P();
  setZ(Math.min((r.width - 60) / (p.w * PX), (r.height - 60) / (p.h * PX)));
};
stage.addEventListener('wheel', e => {
  if (e.ctrlKey) { e.preventDefault(); setZ(ui.zoom - Math.sign(e.deltaY) * 0.1); }
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'z' && e.ctrlKey) { e.preventDefault(); undo(); }
  if (e.key === 'y' && e.ctrlKey) { e.preventDefault(); redo(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const el = selEl(); if (el && !el.locked) mutate(() => { els().splice(els().indexOf(el), 1); ui.sel = null; });
  }
  if (e.key === 'Escape') select(null);
  if (e.key === 'd' && e.ctrlKey) {
    e.preventDefault(); const el = selEl();
    if (el) mutate(() => { const n = JSON.parse(JSON.stringify(el)); n.id = uid(); n.x += 5; n.y += 5; els().push(n); ui.sel = n.id; });
  }
  const step = e.shiftKey ? 5 : 1;
  const el = selEl();
  if (el && !el.locked && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
    mutate(() => {
      const p = P();
      if (e.key === 'ArrowUp') el.y = clamp(el.y - step, 0, p.h - el.h);
      if (e.key === 'ArrowDown') el.y = clamp(el.y + step, 0, p.h - el.h);
      if (e.key === 'ArrowLeft') el.x = clamp(el.x - step, 0, p.w - el.w);
      if (e.key === 'ArrowRight') el.x = clamp(el.x + step, 0, p.w - el.w);
    });
  }
});

/* ===================== Export / Import / Print ===================== */
$('#exportBtn').onclick = () => {
  const b = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'clinic_design.json';
  a.click();
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (d.docs && d.docs.rx) { pushUndo(JSON.stringify(S)); S = d; ui.sel = null; save(); render(); renderProps(); msg('تم استيراد التصميم'); }
      else alert('ملف غير صالح');
    } catch { alert('ملف تالف'); }
  };
  rd.readAsText(f);
};
$('#printBtn').onclick = () => {
  select(null); const was = ui.preview; ui.preview = true; render();
  setTimeout(() => { window.print(); ui.preview = was; render(); }, 100);
};

// Init
if (!S.currency) S.currency = '$';
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
render(); renderProps();
setTimeout(() => $('#zoomFit').click(), 50);
</script>
</body>
